<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #000; color: white; }
  .wrapper { position: relative; width: 100vw; height: 65vh; overflow: hidden; }
  img { width: 100%; height: 100%; object-fit: cover; }
  .grid-y { position: absolute; width: 100%; height: 1px; background: rgba(255,0,0,0.5); }
  .grid-x { position: absolute; width: 1px; height: 100%; background: rgba(255,0,0,0.5); }
  .label-y { position: absolute; left: 0; color: red; font-size: 10px; }
  .label-x { position: absolute; top: 0; color: red; font-size: 10px; }
</style>
</head>
<body>
<div class="wrapper">
  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop&q=80">
  <script>
    for(let i=0; i<=100; i+=5) {
      document.write('<div class="grid-y" style="top:'+i+'%"></div><div class="label-y" style="top:'+i+'%">'+i+'</div>');
      document.write('<div class="grid-x" style="left:'+i+'%"></div><div class="label-x" style="left:'+i+'%">'+i+'</div>');
    }
  </script>
</div>
</body>
</html>
